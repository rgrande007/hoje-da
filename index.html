<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Hoje Dá</title>
<!-- PWA -->
<meta name="theme-color" content="#163B75" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hoje Dá" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
<link rel="icon" href="/icons/icon-512.png" type="image/png" />
<script>
  // Recarrega automaticamente quando um novo service worker assume o controle
  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  }
</script>
<link rel="stylesheet" href="/src/estilos.css" />
</head>
<body>
<div id="root">
  <!-- Tela de abertura: aparece só até o React montar o app -->
  <div class="boot" aria-label="Carregando Hoje Dá">
    <img src="/icons/icon-192.png" width="72" height="72" alt="" />
    <span>Hoje Dá</span>
  </div>
</div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
